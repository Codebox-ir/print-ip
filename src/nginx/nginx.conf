worker_processes 1;

events {
  worker_connections 1024;
}

http {
  error_log /dev/stderr warn;

  # Trust X-Forwarded-For only from private networks (CapRover / Docker networks)
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Common private ranges used by Docker/CapRover
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  # Access log format suitable for GoAccess
  log_format main '$remote_addr - [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'xff="$http_x_forwarded_for"';

  access_log /dev/stdout main;

  # Build the response body based on query and client IP version
  map "$arg_v:$remote_addr" $resp_body {
    default "$remote_addr\n";

    # If v=4 and client IP is IPv6 -> empty body
    ~^4:.*: "";

    # If v=6 and client IP is IPv4 -> empty body
    ~^6:\d+\.\d+\.\d+\.\d+$ "";
  }

  server {
    listen 80;

    location = / {
      default_type text/plain;
      return 200 $resp_body;
    }

    # Simple health check endpoint
    location = /healthz {
      return 200 "ok\n";
    }
  }
}
